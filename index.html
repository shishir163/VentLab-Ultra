<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VentLab Ultra – Ventilator Simulator</title>
<meta name="description" content="Ultra-modern mechanical ventilator simulator: modes, waveforms, loops, abnormalities, asynchrony, learning library.">
<meta name="theme-color" content="#070203">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VentLab">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700&family=Poppins:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-fx" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="bg-grid"></div></div>

<header class="topbar" id="topbar">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 32 32"><path d="M2 18h6l3-9 4 16 4-12 2 5h9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="brand-txt"><b>VentLab</b><span>ULTRA</span></div>
  </div>
  <button class="mode-pill" id="modePill" title="Current mode"></button>
  <div class="spacer"></div>
  <div class="tb-group">
    <button class="ib" id="btnSearch" title="Search (/)"></button>
    <button class="ib primary" id="btnRun" title="Freeze / Run (space)"></button>
    <button class="ib txt" id="btnSpeed" title="Simulation speed">1×</button>
    <button class="ib" id="btnSort" title="Sort cards"></button>
    <button class="ib" id="btnLayout" title="Cards & layout"></button>
    <button class="ib" id="btnTheme" title="Themes & fonts"></button>
    <button class="ib" id="btnMore" title="Backup & about"></button>
  </div>
</header>

<div class="alarm-strip" id="alarmStrip" hidden></div>
<nav class="filterbar" id="filterBar"></nav>

<main class="grid" id="grid"></main>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-head">
    <button class="ib" id="sheetBack" title="Back"></button>
    <h3 id="sheetTitle"></h3>
    <button class="ib" id="sheetClose" title="Close"></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<div class="palette" id="palette" hidden>
  <div class="palette-box">
    <input id="paletteInput" placeholder="Search topics, abnormalities, notes, tags, cards…" autocomplete="off">
    <div class="palette-res" id="paletteRes"></div>
  </div>
</div>

<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast"></div>

<script src="js/engine.js"></script>
<script src="js/content.js"></script>
<script src="js/glossary.js"></script>
<script src="js/content_bn.js"></script>
<script src="js/machines.js"></script>
<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
<script src="js/extras.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
